services:
  # PostgreSQL database
  db:
    image: pgpointcloud/pointcloud:latest
    container_name: seasee-r-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432" # Keeps host access available via localhost:5433
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis
  redis:
    image: redis:7-alpine
    container_name: seasee-r-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6381}:6379" # Keeps host access available via localhost:6381 without conflicting with host redis (6379)
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    container_name: seasee-r-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # RQ Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    container_name: seasee-r-worker
    restart: unless-stopped
    volumes:
      - ./backend:/app
    # Instead of hardcoding the URL in command, reference the env variable
    command: ["rq", "worker", "pointcloud_tasks", "job_tasks", "default", "--url", "${REDIS_URL}"]

    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "rq info -u $${REDIS_URL} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # OpenSfM Dedicated Worker
  opensfm:
    build:
      context: .
      dockerfile: backend/Dockerfile.opensfm-worker
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    container_name: seasee-r-opensfm
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./openSfM/openSfM_core:/source/OpenSfM
    command: ["conda", "run", "-n", "opensfm", "--no-capture-output", "bash", "-c", "cd /source/OpenSfM && pip install --no-cache-dir -e . && cd /app && rq worker -w app.services.worker.opensfm_worker.OpenSfMWorker opensfm_tasks --url $${REDIS_URL}"]
    environment:
      - PYTHONPATH=/app
      - LD_PRELOAD=/opt/conda/envs/opensfm/lib/libtcmalloc.so
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "rq info -u $${REDIS_URL} && python -m app.services.worker.opensfm_worker || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # TUSD Resumable Upload Server
  tusd:
    image: tusproject/tusd:latest
    user: "${UID:-1000}:${GID:-1000}"
    container_name: seasee-r-tusd
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TUSD_UPLOAD_DIR=/srv/tusd-data
    command: >
      -upload-dir /srv/tusd-data
      -behind-proxy
      -hooks-http http://backend:8000/webhooks/tusd
      -hooks-http-forward-headers Cookie,Authorization
      -hooks-enabled-events post-create,post-finish,post-terminate
    volumes:
      - ./backend/data/uploads:/srv/tusd-data
    depends_on:
      backend:
        condition: service_healthy

  # Frontend Dashboard (Nginx SPA)
  frontend:
    build:
      context: ./seaseer-dashboard
      dockerfile: Dockerfile
    container_name: seasee-r-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-}
      - VITE_TUS_URL=${VITE_TUS_URL:-}
      - OPENAPI_INPUT=http://backend:8000/openapi.json
    depends_on:
      backend:
        condition: service_healthy
      tusd:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3


volumes:
  pgdata:
  redisdata:

