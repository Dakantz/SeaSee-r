version: '3.8'

services:
  seasee-r:
    container_name: seasee-r
    build: 
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
      # Mount X11 socket for GUI applications (like Pangolin viewers)
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, utility, compute]
    # Keep container running in the background
    command: sleep infinity
