camera:
  sensor: "1/1.8\""
  pixels: "12MP"
  aperture: "f/2.5"
  focus_range: "0.1m~+∞"
  shutter_speed: "5-1/5000 Second"
  burst_shooting: "1/3/5/10 Frames"
  iso: "100–3200 (Auto/Manual)"
  white_balance: "2500K-7500K (for Seawater & Freshwater, Auto/Manual)"
  exposure_compensation: "-3.0 EV to +3.0 EV (Auto/Manual)"
  photo_resolution:
    "4:3": "4000 × 3000"
    "16:9": "3840 × 2160"
  photo_format: ["JPEG", "DNG"]
  video_resolution:
    4K_UHD: "25/30 fps"
    1080p_FHD: "25/30/50/60/75/90 fps"
    720P_HD: "25/30/50/60/75/90 fps"
  video_encode: "H.264"
  video_format: "MP4"
  stabilization: "Electronic Stabilization (EIS)"
  color_system: "NTSC & PAL"
  internal_storage: "External MicroSD Storage (128GB Standard, Supports up to 512GB)"
  ai_vision_functionality: ["Vision Lock", "Diver Tracking", "Imaging Dehazing"]

# Specific properties for PySLAM processing
pyslam_settings:
  video_dimensions: [3840, 2160]
  fps: 25.0
  fov_above_water: 176
  fov_underwater: 146
  # Intrinsics are estimated based on frame size if not provided
  intrinsics:
    fx: 587.0
    fy: 587.0
    cx: 1920
    cy: 1080
    k1: 0.0
    k2: 0.0
    p1: 0.0
    p2: 0.0
    k3: 0.0
